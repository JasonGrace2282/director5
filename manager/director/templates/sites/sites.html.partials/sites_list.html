{% for site in sites %}
    <c-card class="cursor-pointer min-w-100 max-w-100 max-h-50 min-h-50 group hover:bg-accent">
        <c-card.header>
            <c-card.title>{{ site.name|truncatechars:"50" }}</c-card.title>
            <c-card.description>{{ site.description|truncatechars:"100" }}</c-card.description>
        </c-card.header>
        <c-card.content>
            <c-badge class="font-mono" variant="outline">{{ site.mode|upper }}</c-badge>
        </c-card.content>
        <c-card.footer>
            <div class="flex">
                <p class="group-hover:font-semibold">Manage</p>
                {% lucide "chevron-right" class="mt-0.5 transition-all group-hover:translate-x-1" %}
            </div>
        </c-card.footer>
    </c-card>
{% endfor %}
