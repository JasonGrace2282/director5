<div class="flex hidden absolute flex-col gap-3 justify-center items-center p-2 w-full w-screen transition duration-500 translate-x-full" id="step4" x-data="{ open: false }">
    <div x-data="{
        open: false,
        search: '',
        selectedValues: [{id: {{ request.user.id }}, username: '{{ request.user.username }}'}],
        toggleValue(id, username) {
            if (!this.isSelected(id)) {
                this.selectedValues.push({id: id, username: username});
                selected_user_ids.push(id);
            }
            else
            {
                this.removeValue(id);
            }
        },
        removeValue(id) {
            this.selectedValues = this.selectedValues.filter(user => user.id !== id);
            selected_user_ids = selected_user_ids.filter(user_id => user_id !== id);
        },
        isSelected(id) {
            return this.selectedValues.some(user => user.id === id);
        }
    }">
      <div class="relative w-80 lg:w-100">
        <div @click="open = !open" class="flex items-center p-2 bg-white rounded border cursor-pointer">
            <div class="flex flex-wrap gap-1">
                <template x-for="user in selectedValues" :key="user.id">
                    <div class="flex items-center py-0.5 px-2.5 text-sm font-medium text-gray-800 bg-gray-200 rounded me-2">
                        <p class="pointer-events-none" x-text="user.username"></p>
                        <button @click="removeValue(user.id)" class="ml-1 text-gray-600 hover:text-black">{% lucide "x" class="w-3 h-3" %}</button>
                    </div>
                    <span class="text-gray-400" x-show="selectedValues.length === 0">Select users...</span>
                </template>
                <input class="w-full focus:outline-none" type="text" x-init="$watch('open', value => { value ? $el.focus() : $el.blur() })" x-model="search" />
            </div>
            {% lucide "chevron-down" class="absolute right-3" %}
        </div>
      </div>
      <div class="mt-1 w-64" x-cloak x-show="open" x-transition @click.away="open = false">
        <ul class="overflow-y-auto z-10 w-full max-h-60 bg-white rounded-lg border shadow-lg border-border">
          {% for user in users %}
            <li class="block flex items-center p-2 border-b cursor-pointer hover:bg-gray-100"
                x-show="search === '' || '{{ user.full_name }}'.toLowerCase().includes(search.toLowerCase()) || '{{ user.username }}'.toLowerCase().includes(search.toLowerCase())"
                @click="toggleValue({{ user.id }}, '{{ user.username }}')">
                <span x-show="isSelected({{ user.id }})">{% lucide "check" %}</span>
                <span class="ml-2">{{ user.username }}</span>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
</div>
